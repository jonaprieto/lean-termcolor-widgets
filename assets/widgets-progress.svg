<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">termcolor-widgets progress and status controls</title>
  <desc id="desc">Pure CLI widgets showing progress bars, indeterminate work, spinners, and status messages.</desc>
  <rect width="1200" height="560" rx="20" fill="#1e1e2e"/>
  <rect width="1200" height="58" rx="20" fill="#292b3b"/><rect y="38" width="1200" height="20" fill="#292b3b"/>
  <circle cx="32" cy="29" r="8" fill="#f38ba8"/><circle cx="58" cy="29" r="8" fill="#f9e2af"/><circle cx="84" cy="29" r="8" fill="#a6e3a1"/>
  <text x="116" y="36" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700">termcolor-widgets · pure CLI views</text>
  <text x="48" y="100" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="28" font-weight="700">Progress is data · timing belongs to the caller</text>
  <text x="48" y="132" fill="#a6adc8" font-family="SFMono-Regular,Menlo,monospace" font-size="17">render once, redraw through termcolor-terminal when a live TTY is available</text>
  <rect x="40" y="158" width="1120" height="350" rx="16" fill="#181825" stroke="#45475a" stroke-width="2"/>
  <text x="72" y="204" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">KNOWN TOTALS</text>
  <text x="72" y="246" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="20">download</text><text x="236" y="246" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">[</text><rect x="254" y="229" width="420" height="20" rx="5" fill="#45475a"/><rect x="254" y="229" width="294" height="20" rx="5" fill="#a6e3a1"/><text x="694" y="246" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">] 70%</text>
  <text x="72" y="286" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="20">compile</text><text x="236" y="286" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">[</text><rect x="254" y="269" width="420" height="20" rx="5" fill="#45475a"/><rect x="254" y="269" width="126" height="20" rx="5" fill="#cba6f7"/><text x="694" y="286" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">] 30%</text>
  <text x="72" y="326" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="20">quiet</text><text x="236" y="326" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">[</text><rect x="254" y="309" width="420" height="20" rx="5" fill="#45475a"/><text x="694" y="326" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">]</text>
  <text x="72" y="376" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">UNKNOWN TOTAL</text>
  <text x="72" y="418" fill="#94e2d5" font-family="SFMono-Regular,Menlo,monospace" font-size="20">indexing</text><text x="236" y="418" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">[</text><rect x="254" y="401" width="420" height="20" rx="5" fill="#45475a"/><rect x="474" y="401" width="105" height="20" rx="5" fill="#94e2d5"/><text x="694" y="418" fill="#cdd6f4" font-family="SFMono-Regular,Menlo,monospace" font-size="20">] …</text>
  <text x="760" y="246" fill="#cba6f7" font-family="SFMono-Regular,Menlo,monospace" font-size="18" font-weight="700">SPINNERS + STATUS</text>
  <text x="760" y="286" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="21">⠸ working</text>
  <text x="760" y="330" fill="#a6e3a1" font-family="SFMono-Regular,Menlo,monospace" font-size="21">[ok] build complete</text>
  <text x="760" y="374" fill="#f9e2af" font-family="SFMono-Regular,Menlo,monospace" font-size="21">[warn] using a fallback</text>
  <text x="760" y="418" fill="#f38ba8" font-family="SFMono-Regular,Menlo,monospace" font-size="21">[error] build failed</text>
  <text x="760" y="476" fill="#6c7086" font-family="SFMono-Regular,Menlo,monospace" font-size="15">clamped totals · custom glyphs · plain fallback</text>
</svg>
